services:
  frontend:
    build: ./frontend
    image: arcos_montoya-frontend:v1
    pull_policy: build
    ports:
      - "3000:3000"
    networks:
      - cv_network
    depends_on:
      - backend

  backend:
    build: ./backend
    image: arcos_montoya-backend:v1
    pull_policy: build
    ports:
      - "4000:4000"
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=cv_db
    restart: always
    networks:
      - cv_network
    depends_on:
      - database

  database:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cv_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cv_network

networks:
  cv_network:

volumes:
  mysql_data:
